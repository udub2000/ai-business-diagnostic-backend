<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Uniikye Truth — Business Diagnostic V2 Staging</title></head><body><div id="ai-diagnostic-root"></div><style>
#ai-diagnostic-root{--navy:#071126;--ink:#0f172a;--muted:#53627a;--line:#dbe3ef;--soft:#f3f6fa;--bg:#f7f9fc;font-family:Inter,Arial,sans-serif;color:var(--ink);width:100%;display:block;}
#ai-diagnostic-root *{box-sizing:border-box;}
.entry-content,.wp-block-html,.wp-site-blocks{max-width:none!important;width:100%!important;}
/* Full-width breakout: escape the WordPress theme content-width wrapper without changing diagnostic behavior. */
#ai-diagnostic-root{position:relative;left:50%;width:100vw!important;max-width:100vw!important;margin-left:-50vw!important;margin-right:-50vw!important;}
body:has(#ai-diagnostic-root) .wp-site-blocks,body:has(#ai-diagnostic-root) main,body:has(#ai-diagnostic-root) .entry-content,body:has(#ai-diagnostic-root) .wp-block-post-content,body:has(#ai-diagnostic-root) .wp-block-group,body:has(#ai-diagnostic-root) .wp-block-html{max-width:none!important;}
#ai-diagnostic-root .diag-page{background:var(--bg);padding:32px 24px 56px;min-height:100vh;width:100%;}

#ai-diagnostic-root .diag-pill{display:inline-block;border:1px solid var(--line);background:white;border-radius:999px;padding:7px 15px;font-size:13px;font-weight:700;letter-spacing:.02em;color:#34425c;margin-bottom:18px;}

#ai-diagnostic-root .diag-panel{border-radius:24px;min-height:500px;overflow:hidden;width:100%;min-width:0;}

#ai-diagnostic-root .form-grid{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:20px!important;align-items:start!important;width:100%!important;}
#ai-diagnostic-root .full-width{grid-column:1 / -1!important;}
#ai-diagnostic-root .field{display:block!important;margin:0!important;min-width:0!important;width:100%!important;}
#ai-diagnostic-root .field-label{font-size:14px;font-weight:600;color:#0f172a;margin-bottom:8px;display:block;}
#ai-diagnostic-root .field-hint{font-size:12px;color:#64748b;margin-top:-2px;margin-bottom:8px;display:block;}
#ai-diagnostic-root .input,#ai-diagnostic-root .select,#ai-diagnostic-root .textarea{width:100%!important;border:1px solid #cfd9e8;border-radius:16px;background:white;padding:13px 16px;min-height:48px;font-size:14px;color:#0f172a;outline:none;display:block;}
#ai-diagnostic-root .textarea{min-height:112px;resize:vertical;}
#ai-diagnostic-root .input:focus,#ai-diagnostic-root .select:focus,#ai-diagnostic-root .textarea:focus{border-color:#64748b;box-shadow:0 0 0 3px rgba(148,163,184,.15);}
#ai-diagnostic-root .segmented{display:grid!important;grid-template-columns:1fr 1fr 1fr!important;gap:8px!important;background:#f1f5f9;border-radius:16px;padding:4px;}

#ai-diagnostic-root .btn{border:1px solid #cfd9e8;background:white;color:#14213b;border-radius:16px;padding:13px 20px;font-size:14px;font-weight:600;cursor:pointer;}
#ai-diagnostic-root .btn.primary{background:var(--navy);color:white;border-color:var(--navy);}
#ai-diagnostic-root .btn:disabled{opacity:.45;cursor:not-allowed;}
#ai-diagnostic-root .upload-box{grid-column:1 / -1!important;background:#f8fafc;border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:4px;}
#ai-diagnostic-root .upload-box h3{margin:0 0 8px;font-size:15px;}
#ai-diagnostic-root .upload-box p{margin:0 0 16px;color:#475569;font-size:14px;}
#ai-diagnostic-root .file-grid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:16px!important;}
#ai-diagnostic-root .file-card{border:1px solid #cfd9e8;border-radius:16px;background:white;padding:14px;}
#ai-diagnostic-root .file-card label{display:block;margin-bottom:10px;font-size:14px;font-weight:600;}
#ai-diagnostic-root .file-card input{max-width:100%;font-size:13px;}
#ai-diagnostic-root .review-box,#ai-diagnostic-root .status,#ai-diagnostic-root .report{background:#f8fafc;border:1px solid var(--line);border-radius:16px;padding:18px;color:#24324a;}
#ai-diagnostic-root .review-box{margin-bottom:18px;}
#ai-diagnostic-root .status{margin-top:22px;white-space:pre-wrap;display:none;font-size:14px;line-height:1.55;}
#ai-diagnostic-root .status.show{display:block;}
#ai-diagnostic-root .report{margin-top:24px;background:white;white-space:pre-wrap;line-height:1.6;display:none;}
#ai-diagnostic-root .report.show{display:block;}
#ai-diagnostic-root .error{border-color:#fecaca;background:#fef2f2;color:#b91c1c;}#ai-diagnostic-root .diag-progress-bar{height:7px;background:#e8edf4;border-radius:999px;overflow:hidden;margin-top:10px;width:180px}#ai-diagnostic-root .diag-progress-fill{height:100%;background:var(--navy);border-radius:999px}#ai-diagnostic-root .file-status{margin-top:10px;font-size:12px;color:#64748b;line-height:1.4}#ai-diagnostic-root .file-status.ready{color:#166534;font-weight:700}#ai-diagnostic-root .consent-box{margin-top:18px;padding:18px;border:1px solid var(--line);background:#f8fafc;border-radius:16px;display:flex;gap:12px;align-items:flex-start}#ai-diagnostic-root .consent-box input{margin-top:3px}#ai-diagnostic-root .consent-box label{font-size:13px;line-height:1.55;color:#334155}#ai-diagnostic-root .welcome-page{background:var(--bg);padding:44px 24px 64px;min-height:100vh}#ai-diagnostic-root .welcome-wrap{max-width:1040px;margin:0 auto}#ai-diagnostic-root .welcome-card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:40px}#ai-diagnostic-root .welcome-grid{display:grid;grid-template-columns:1.35fr .9fr;gap:44px}#ai-diagnostic-root .welcome-title{font-size:42px;line-height:1.08;margin:12px 0 18px;font-weight:800}#ai-diagnostic-root .welcome-copy{font-size:17px;line-height:1.65;color:#334155}#ai-diagnostic-root .welcome-points{margin:24px 0 30px;padding:0;list-style:none}#ai-diagnostic-root .welcome-points li{padding:10px 0;border-bottom:1px solid #edf1f6;color:#334155;font-size:14px;line-height:1.5}#ai-diagnostic-root .welcome-side{background:#f8fafc;border:1px solid var(--line);border-radius:20px;padding:22px}#ai-diagnostic-root .welcome-side h3{margin:0 0 12px}#ai-diagnostic-root .welcome-side p{color:#475569;font-size:14px;line-height:1.55}#ai-diagnostic-root .privacy-note{font-size:12px;color:#64748b;line-height:1.55;margin-top:16px}@media(max-width:900px){#ai-diagnostic-root .welcome-grid{grid-template-columns:1fr}#ai-diagnostic-root .welcome-card{padding:26px}#ai-diagnostic-root .welcome-title{font-size:34px}}
@media (max-width:900px){#ai-diagnostic-root .diag-top,#ai-diagnostic-root .diag-main,#ai-diagnostic-root .form-grid,#ai-diagnostic-root .file-grid{grid-template-columns:1fr!important;}#ai-diagnostic-root .diag-title{font-size:32px;}#ai-diagnostic-root .diag-side{min-height:auto;}#ai-diagnostic-root .full-width,#ai-diagnostic-root .upload-box{grid-column:auto!important;}}

#ai-diagnostic-root .report-page{background:var(--bg);padding:32px 24px 56px;min-height:100vh;width:100%;}
#ai-diagnostic-root .report-wrap{max-width:1280px;margin:0 auto;width:100%;}
#ai-diagnostic-root .report-kicker{text-transform:uppercase;letter-spacing:.08em;font-size:13px;font-weight:700;color:#64748b;margin-bottom:8px;}
#ai-diagnostic-root .report-title{font-size:40px;line-height:1.1;margin:0;color:#020817;font-weight:800;}
#ai-diagnostic-root .report-subtitle{max-width:760px;margin:10px 0 0;color:#475569;font-size:15px;line-height:1.5;}
#ai-diagnostic-root .hero-grid{display:grid!important;grid-template-columns:1fr 1fr 1fr!important;gap:16px;margin-top:28px;margin-bottom:28px;}
#ai-diagnostic-root .hero-card{border-radius:24px;padding:24px;box-shadow:0 2px 8px rgba(15,23,42,.05);border:1px solid var(--line);background:#fff;}
#ai-diagnostic-root .hero-card.dark{background:#020817;color:#fff;border-color:#020817;}
#ai-diagnostic-root .hero-card.green{background:#064e3b;color:#fff;border-color:#064e3b;}
#ai-diagnostic-root .hero-card.indigo{background:#312e81;color:#fff;border-color:#312e81;}
#ai-diagnostic-root .hero-badge{display:inline-flex;border-radius:999px;background:rgba(255,255,255,.12);padding:6px 10px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;}
#ai-diagnostic-root .hero-main{margin-top:18px;font-size:30px;font-weight:800;line-height:1.1;}
#ai-diagnostic-root .hero-text{margin-top:12px;font-size:14px;line-height:1.5;color:rgba(255,255,255,.82);}
#ai-diagnostic-root .hero-pattern{margin-top:14px;border-radius:16px;background:rgba(255,255,255,.12);padding:12px 14px;font-size:14px;color:rgba(255,255,255,.88);}
#ai-diagnostic-root .metric-label{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:#64748b;}
#ai-diagnostic-root .metric-value{margin-top:12px;font-size:30px;font-weight:800;color:#020817;}
#ai-diagnostic-root .metric-small{margin-top:4px;font-size:14px;color:#64748b;}
#ai-diagnostic-root .bar{height:8px;background:#eef2f7;border-radius:999px;overflow:hidden;margin-top:18px;}
#ai-diagnostic-root .bar-fill{height:100%;background:#020817;border-radius:999px;}
#ai-diagnostic-root .report-grid{display:grid!important;grid-template-columns:minmax(0,1fr) 320px!important;gap:24px;}
#ai-diagnostic-root .report-card{border:1px solid var(--line);background:#fff;border-radius:24px;box-shadow:0 2px 8px rgba(15,23,42,.04);overflow:hidden;}
#ai-diagnostic-root .report-card-head{padding:18px 24px;border-bottom:1px solid #edf1f6;font-size:18px;font-weight:800;color:#020817;}
#ai-diagnostic-root .report-card-body{padding:24px;}
#ai-diagnostic-root .markdown{font-size:15px;line-height:1.7;color:#1f2937;}
#ai-diagnostic-root .markdown h1,#ai-diagnostic-root .markdown h2,#ai-diagnostic-root .markdown h3{color:#020817;margin:22px 0 10px;line-height:1.25;}
#ai-diagnostic-root .markdown h1{font-size:28px;}
#ai-diagnostic-root .markdown h2{font-size:22px;}
#ai-diagnostic-root .markdown h3{font-size:18px;}
#ai-diagnostic-root .markdown p{margin:0 0 14px;}
#ai-diagnostic-root .markdown ul,#ai-diagnostic-root .markdown ol{padding-left:22px;margin:0 0 14px;}
#ai-diagnostic-root .score-row{margin-bottom:16px;}
#ai-diagnostic-root .score-line{display:flex;justify-content:space-between;gap:16px;margin-bottom:6px;font-size:14px;}
#ai-diagnostic-root .score-name{text-transform:capitalize;color:#475569;}
#ai-diagnostic-root .score-val{font-weight:800;color:#020817;}
#ai-diagnostic-root .state-row{display:flex;justify-content:space-between;gap:16px;padding:8px 0;font-size:14px;}
#ai-diagnostic-root .state-label{color:#64748b;}
#ai-diagnostic-root .state-value{font-weight:800;color:#020817;text-align:right;}
#ai-diagnostic-root .simple-list{margin:0;padding-left:20px;color:#334155;font-size:14px;line-height:1.6;}
#ai-diagnostic-root .back-link{display:inline-flex;margin-bottom:20px;border:1px solid #cfd9e8;background:#fff;color:#14213b;border-radius:14px;padding:10px 14px;font-size:14px;cursor:pointer;text-decoration:none;}
@media (max-width:900px){#ai-diagnostic-root .hero-grid,#ai-diagnostic-root .report-grid{grid-template-columns:1fr!important;}#ai-diagnostic-root .report-title{font-size:32px;}}

/* Staging integration overrides */
html,body{margin:0} #ai-diagnostic-root{left:auto!important;margin:0!important;width:100%!important;max-width:100%!important}
#ai-diagnostic-root .diag-step-nav{cursor:pointer;border:0;width:100%;text-align:left;font:inherit}
#ai-diagnostic-root .diag-step-nav:disabled{opacity:.65;cursor:default}
#ai-diagnostic-root .question-card{padding:16px;border:1px solid var(--line);border-radius:16px;background:#fff;margin-bottom:16px}
#ai-diagnostic-root .question-card .field-label{line-height:1.45}
#ai-diagnostic-root .question-id{font-size:11px;font-weight:800;color:#64748b;margin-bottom:5px}
#ai-diagnostic-root .question-card .textarea{min-height:85px}
#ai-diagnostic-root .notice{padding:15px;border:1px solid #dbe3ef;border-radius:14px;background:#f8fafc;font-size:13px;line-height:1.55;color:#334155}
#ai-diagnostic-root .review-list{margin:10px 0;padding-left:20px;line-height:1.65}
#ai-diagnostic-root .report-card{margin-bottom:18px}
#ai-diagnostic-root .report-card-body{white-space:pre-wrap;line-height:1.65}
#ai-diagnostic-root .file-card input:disabled{opacity:.55}
</style><script>(()=>{'use strict';
const ROOT=document.getElementById('ai-diagnostic-root');
const API='/staging';
const STEPS=['Business Info','Demand','Conversion','Capacity','Operations','Financials','Review'];
const CATEGORIES={
 'Home & Field Services':['lawn care','roofing'],
 'Professional Services':['fixed-fee consulting','wealth advisory'],
 'Relationship & Transaction Services':['brokerage and staffing','recruiting'],
 'Other Client-Based Business':['event management','fitness studio','managed it','outpatient rehabilitation']
};
const STEP_FOR={BC:0,D:1,C:2,CA:3,O:4,F:5};
const state={step:0,started:false,category:'',type:'',goal:'',businessName:'',location:'',mode:'hybrid',seasonality:'',notes:'',answers:{},conditions:{},result:null,busy:false};
let catalog={};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>ROOT.querySelector(s);
const typeOptions=()=> (CATEGORIES[state.category]||[]).filter(t=>catalog[t]);
function stepFor(q){const map={'Business Info':0,'Demand':1,'Conversion':2,'Capacity':3,'Operations':4,'Financials':5};if(q.section in map)return map[q.section];const id=q.id.replace(/^(Demand|Conversion|Capacity|Operations|Financials)\s+/,'');const prefix=id.split('-')[0];return Object.prototype.hasOwnProperty.call(STEP_FOR,prefix)?STEP_FOR[prefix]:4;}
function questions(step){return (catalog[state.type]?.questions||[]).filter(q=>stepFor(q)===step);}
function input(name,label,value='',hint='',full=false){return `<label class="field ${full?'full-width':''}"><span class="field-label">${esc(label)}</span>${hint?`<span class="field-hint">${esc(hint)}</span>`:''}<input class="input" name="${esc(name)}" value="${esc(value)}" maxlength="500"></label>`;}
function dropdown(name,label,items,value='',full=false){return `<label class="field ${full?'full-width':''}"><span class="field-label">${esc(label)}</span><select class="select" name="${esc(name)}"><option value="">Select</option>${items.map(x=>`<option value="${esc(x)}" ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`;}
function save(){ROOT.querySelectorAll('[data-answer-id]').forEach(el=>state.answers[el.dataset.answerId]=el.value);ROOT.querySelectorAll('[data-condition-id]').forEach(el=>state.conditions[el.dataset.conditionId]=el.value);ROOT.querySelectorAll('[data-state]').forEach(el=>state[el.dataset.state]=el.value);}
function welcome(){ROOT.innerHTML=`<div class="welcome-page"><div class="welcome-wrap"><div class="welcome-card"><div class="welcome-grid"><div><span class="diag-pill">THE UNIIKYE TRUTH — V2 STAGING</span><h1 class="welcome-title">Business Diagnostic</h1><p class="welcome-copy">Understand where your business stands, what deserves attention, and which next steps may help. This version adapts its questions to your type of service business.</p><ul class="welcome-points"><li><strong>Business-specific questions.</strong> Select a category and business type.</li><li><strong>Use the information you know.</strong> Unknown answers are acceptable.</li><li><strong>Review findings.</strong> Generate a preliminary six-section internal assessment.</li><li><strong>Test environment only.</strong> Use synthetic business information, not real customer or financial records.</li></ul><button class="btn primary" id="start">Begin Business Diagnostic</button><div class="privacy-note">No customer email, payment, or production report is generated in this test.</div></div><div class="welcome-side"><h3>What the diagnostic evaluates</h3><p><strong>Demand & Conversion</strong><br>How work enters the business and converts into revenue.</p><p><strong>Capacity & Operations</strong><br>People, scheduling, delivery and workflow constraints.</p><p><strong>Financial Performance</strong><br>Revenue, profitability, cash flow and financial evidence.</p><p><strong>Business Context</strong><br>Business objectives, changes, risks and industry-specific conditions.</p></div></div></div></div></div>`;$('#start').onclick=()=>{state.started=true;render();};}
function qhtml(q){const id=q.id;return `<div class="question-card"><div class="question-id">${esc(id)}</div><label class="field"><span class="field-label">${esc(q.label)}</span><textarea class="textarea" data-answer-id="${esc(id)}" placeholder="Your answer (or leave blank if unknown)" maxlength="8000">${esc(state.answers[id]||'')}</textarea></label><label class="field" style="margin-top:12px!important"><span class="field-label">Answer confidence (staging note only)</span><select class="select" data-condition-id="${esc(id)}"><option value="">Owner-reported / unverified</option><option value="confirmed" ${state.conditions[id]==='confirmed'?'selected':''}>Records available (not submitted to analysis)</option><option value="estimate" ${state.conditions[id]==='estimate'?'selected':''}>Estimate (not submitted to analysis)</option></select></label></div>`;}
function body(){if(state.step===0){return `<div class="form-grid">${dropdown('category','Business category',Object.keys(CATEGORIES),state.category)}${dropdown('type','Business type',typeOptions(),state.type)}${input('businessName','Business name (synthetic)',state.businessName,'Do not enter real customer information')}${input('location','Location (optional)',state.location)}${input('goal','Business objective',state.goal,'What is the business trying to improve?',true)}${dropdown('mode','How closely do you track your business numbers?',['metrics','hybrid','guided'],state.mode)}${dropdown('seasonality','Seasonality context',['Peak season','Normal season','Slow season','Not applicable'],state.seasonality)}</div>${state.type?`<h3>Business context</h3>${questions(0).map(qhtml).join('')}`:'<div class="notice" style="margin-top:20px">Select a business category, then choose a business type to load its questions.</div>'}`;}
if(state.step===6){const answered=Object.values(state.answers).filter(v=>v&&v.trim()).length;return `<div class="review-box"><strong>Assessment review</strong><ul class="review-list"><li>Category: ${esc(state.category||'Not selected')}</li><li>Business type: ${esc(state.type||'Not selected')}</li><li>Objective: ${esc(state.goal||'Not provided')}</li><li>Answered questions: ${answered} of ${(catalog[state.type]?.questions||[]).length}</li></ul></div><label class="field"><span class="field-label">Additional notes and context</span><textarea class="textarea" data-state="notes" maxlength="8000" placeholder="Important challenges, recent changes or uncertainties">${esc(state.notes)}</textarea></label><div class="notice" style="margin-top:20px"><strong>Internal staging only.</strong> The resulting assessment is a provisional review, not a verified client report. No emails are sent, and no files are uploaded.</div><div id="submit-status" class="status"></div>`;}
const qs=questions(state.step);return `<div class="notice" style="margin-bottom:18px">${esc(state.type)} · ${qs.length} questions in this section. Answer what you know; unanswered questions remain unknown.</div>${qs.map(qhtml).join('')}${state.step===5?`<div class="upload-box"><h3>Optional enhanced financial analysis</h3><p>Income Statement, Balance Sheet, Cash Flow Statement and Additional Business Documents will be available when the full staging upload workflow is connected.</p><div class="file-grid">${['Income Statement','Balance Sheet','Cash Flow Statement','Additional Business Documents'].map(n=>`<div class="file-card"><label>${n}</label><input type="file" disabled><div class="file-status">Unavailable in this internal questionnaire test — no file is transmitted</div></div>`).join('')}</div></div>`:''}`;}
function render(){if(!state.started){welcome();return;}ROOT.innerHTML=`<div class="diag-page"><div class="diag-wrap"><div class="diag-top"><div><span class="diag-pill">THE UNIIKYE TRUTH — STAGING ONLY</span><h1 class="diag-title">AI Business Diagnostic</h1><p class="diag-subtitle">A business-specific assessment of demand, conversion, capacity, operations and financial performance.</p></div><div class="diag-info-card"><h3>Internal test environment</h3><p>Preserves the original seven-step experience while testing the expanded questionnaire.</p><p>Use synthetic information only. No production services, email or payment are connected.</p></div></div><div class="diag-main"><div class="diag-side"><h3>Diagnostic Flow</h3>${STEPS.map((s,i)=>`<button type="button" class="diag-step-nav ${i===state.step?'active':i<state.step?'done':''}" data-step="${i}" ${!state.type&&i>0?'disabled':''}><span class="diag-step-num">${i+1}</span><span>${s}</span></button>`).join('')}</div><div class="diag-panel"><div class="diag-panel-head"><h2>${STEPS[state.step]}</h2><div><span class="diag-progress-text">Step ${state.step+1} of ${STEPS.length}</span><div class="diag-progress-bar"><div class="diag-progress-fill" style="width:${Math.round((state.step+1)/7*100)}%"></div></div></div></div><div class="diag-panel-body"><div id="step-content">${body()}</div><div class="actions"><button class="btn" id="back" ${state.step===0?'disabled':''}>Back</button><button class="btn primary" id="next" ${state.busy?'disabled':''}>${state.step===6?'Generate Internal Review':'Continue'}</button></div></div></div></div></div></div>`;
ROOT.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{save();state.step=Number(b.dataset.step);render();});$('#back').onclick=()=>{save();state.step--;render();};$('#next').onclick=()=>{save();if(!state.type){alert('Select a business category and business type.');return;}if(state.step===6){submit();return;}state.step++;render();window.scrollTo(0,0);};
const cat=$('[name=category]');if(cat)cat.onchange=()=>{save();state.category=cat.value;state.type='';state.answers={};state.conditions={};render();};const type=$('[name=type]');if(type)type.onchange=()=>{save();state.type=type.value;state.answers={};state.conditions={};render();};}
async function submit(){if(state.busy)return;state.busy=true;const btn=$('#next'),status=$('#submit-status');btn.disabled=true;status.className='status show';status.textContent='Preparing internal review…';const questionsAll=catalog[state.type]?.questions||[];const answers=questionsAll.map(q=>({question_id:q.id,response:(state.answers[q.id]||'').trim()||'unknown'}));if(state.notes.trim())answers.push({question_id:'STAGING-NOTES',response:state.notes.trim()});try{const r=await fetch(API+'/internal-review-draft',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({business_type:state.type,owner_goal:state.goal||null,answers,condition_selections:[]})});const data=await r.json();if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:'Assessment rejected');state.result=data;showReport();}catch(e){status.className='status show error';status.textContent='Assessment failed: '+e.message;}finally{state.busy=false;btn.disabled=false;}}
function showReport(){const sections=state.result?.sections||{};ROOT.innerHTML=`<div class="report-page"><div class="report-wrap"><button class="back-link" id="back-to-review">← Back to review</button><div class="report-kicker">The Uniikye Truth — Internal Staging</div><h1 class="report-title">Business Diagnostic | Review</h1><p class="report-subtitle">${esc(state.businessName||state.type)} · ${esc(state.category)} · This is a provisional internal assessment, not a final customer report.</p><div class="hero-grid"><div class="hero-card dark"><div class="hero-badge">Preliminary priority</div><div class="hero-main" style="font-size:20px">${esc(sections.primary_constraint||'Review required')}</div></div><div class="hero-card"><div class="metric-label">Evidence items</div><div class="metric-value">${esc(state.result.evidence_count??'—')}</div><div class="metric-small">Self-reported, not independently verified</div></div><div class="hero-card"><div class="metric-label">Report status</div><div class="metric-value" style="font-size:21px">Internal review</div><div class="metric-small">No email or financial upload performed</div></div></div><div class="report-grid"><div>${Object.entries(sections).map(([k,v])=>`<section class="report-card"><div class="report-card-head">${esc(k.replaceAll('_',' '))}</div><div class="report-card-body">${Array.isArray(v)?`<ol>${v.map(a=>`<li>${esc(a)}</li>`).join('')}</ol>`:esc(v)}</div></section>`).join('')}</div><aside><div class="report-card"><div class="report-card-head">Diagnostic State</div><div class="report-card-body">${esc(state.result.report_status||'Internal review')}<p>Constraint and recommendations require verification.</p></div></div><div class="report-card"><div class="report-card-head">Next steps</div><div class="report-card-body">Review evidence quality and recommendations. Full customer PDF, financial uploads and test-only email delivery are not yet connected to this interface.</div></div></aside></div></div></div>`;$('#back-to-review').onclick=()=>{state.step=6;render();};window.scrollTo(0,0);}
fetch(API+'/questionnaire-catalog',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Questionnaire catalog unavailable');return r.json();}).then(d=>{catalog=d;render();}).catch(e=>{ROOT.textContent='Staging questionnaire could not load: '+e.message;});
})();</script></body></html>
